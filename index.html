<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AM/NS India - 5S Audit Portal</title>
  <style>
    :root {
      --primary: #0F172A;
      --brand-red: #E31837;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --border: #E2E8F0;
      --text: #1E293B;
      --text-muted: #64748B;
      --success: #10B981;
      --danger: #EF4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
      padding: 24px;
      color: white;
      border-bottom: 4px solid var(--brand-red);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 800;
    }

    .header p {
      font-size: 13px;
      color: #94A3B8;
      margin-top: 4px;
    }

    .logo-badge {
      text-align: right;
    }

    .logo-badge .brand {
      font-size: 24px;
      font-weight: 900;
      color: var(--brand-red);
      line-height: 1;
    }

    .logo-badge .sub {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    form {
      padding: 24px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    @media (max-width: 640px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input, .form-group select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      background: #F8FAFC;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
      background: #FFF;
    }

    .score-card {
      background: #F1F5F9;
      padding: 16px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-left: 4px solid var(--primary);
    }

    .score-card .title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .score-card .score-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--success);
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--primary);
    }

    .item-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      background: #FFF;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .item-name {
      font-size: 14px;
      font-weight: 700;
      flex: 1;
    }

    .status-select {
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .status-select.VERIFIED { color: var(--success); border-color: var(--success); background: #ECFDF5; }
    .status-select.NOT_COMPLIANT { color: var(--danger); border-color: var(--danger); background: #FEF2F2; }

    .item-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 640px) {
      .item-details { grid-template-columns: 1fr; }
    }

    .image-preview-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .image-preview-container img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .btn-submit {
      width: 100%;
      background: var(--brand-red);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #C1121F;
    }

    .btn-submit:disabled {
      background: #94A3B8;
      cursor: not-allowed;
    }

    #statusMessage {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    #statusMessage.success { background: #DEF7EC; color: #03543F; display: block; }
    #statusMessage.error { background: #FDE8E8; color: #9B1C1C; display: block; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div>
        <h1>AM/NS INDIA — Pune Facility</h1>
        <p>5S Compliance Assessment Portal</p>
      </div>
      <div class="logo-badge">
        <div class="brand">AM/NS</div>
        <div class="sub">INDIA</div>
      </div>
    </div>

    <form id="auditForm">
      <!-- Audit Header Details -->
      <div class="grid-2">
        <div class="form-group">
          <label>Facility Name</label>
          <input type="text" id="facility" value="Pune Facility" required readonly>
        </div>
        <div class="form-group">
          <label>Review Cycle / No.</label>
          <input type="text" id="reviewNo" placeholder="e.g. AUD-2026-Q1" required>
        </div>
        <div class="form-group">
          <label>Review Date</label>
          <input type="date" id="date" required>
        </div>
        <div class="form-group">
          <label>Department / Zone</label>
          <select id="zone" required>
            <option value="">Select Zone</option>
            <option value="CGL -1">CGL -1</option>
            <option value="CCL">CCL</option>
            <option value="MAIN OFFICE">MAIN OFFICE</option>
          </select>
        </div>
        <div class="form-group" style="grid-column: span 2;">
          <label>Area Incharge</label>
          <input type="text" id="incharge" placeholder="Enter Incharge Name" required>
        </div>
      </div>

      <!-- Live Compliance Score -->
      <div class="score-card">
        <div class="title">Calculated 5S Compliance Score</div>
        <div class="score-value" id="scoreDisplay">100%</div>
      </div>

      <!-- 15 Audit Items -->
      <div class="section-title">5S Compliance Checkpoints (15 Items)</div>
      <div id="itemsContainer"></div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit" id="submitBtn">Submit 5S Audit Report</button>
      <div id="statusMessage"></div>
    </form>
  </div>

  <script>
    // Replace with your Power Automate HTTP Endpoint URL
    const FLOW_HTTP_URL = "https://default37cd273a1cec4aaea29741480ea54f.8d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/16/workflows/ee70acfdac394f1e816aa87f17c92d92/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=8bJao27nNOsK-em9gx4pSqMxOhGxqJ5O3ze7RGjsRCU";

    // 15 Standard 5S Checkpoints
    const checkPoints = [
      "1. Seiri (Sort): Unnecessary items identified & removed",
      "2. Seiri (Sort): Red-tag system applied for unused tools/materials",
      "3. Seiri (Sort): Walkways & aisles clear of obstructions",
      "4. Seiton (Set in Order): Everything has a designated place & label",
      "5. Seiton (Set in Order): Tools stored logically near usage areas",
      "6. Seiton (Set in Order): Shadow boards/floor markings used properly",
      "7. Seiso (Shine): Machines, equipment & work surfaces are clean",
      "8. Seiso (Shine): Cleaning schedules assigned & followed",
      "9. Seiso (Shine): No oil leaks, dust accumulations, or debris",
      "10. Seiketsu (Standardize): 5S standards & visual controls posted",
      "11. Seiketsu (Standardize): Color coding rules implemented consistently",
      "12. Seiketsu (Standardize): Standard Operating Procedures (SOPs) visible",
      "13. Shitsuke (Sustain): Daily 5S audits/checks conducted",
      "14. Shitsuke (Sustain): Safety gear (PPE) used properly in zone",
      "15. Shitsuke (Sustain): Team actively maintains 5S discipline"
    ];

    const itemsContainer = document.getElementById("itemsContainer");
    const itemDataStore = {};

    // Set default date to today
    document.getElementById("date").valueAsDate = new Date();

    // Render 15 checkpoints
    checkPoints.forEach((title, index) => {
      const itemId = `item_${index + 1}`;
      itemDataStore[itemId] = {
        id: itemId,
        name: title,
        status: "VERIFIED",
        remark: "",
        livePhotos: []
      };

      const card = document.createElement("div");
      card.className = "item-card";
      card.innerHTML = `
        <div class="item-header">
          <div class="item-name">${title}</div>
          <select class="status-select VERIFIED" onchange="updateItemStatus('${itemId}', this)">
            <option value="VERIFIED">✓ VERIFIED</option>
            <option value="NOT COMPLIANT">✕ NOT COMPLIANT</option>
          </select>
        </div>
        <div class="item-details">
          <div class="form-group">
            <label>Incharge Remarks</label>
            <input type="text" placeholder="Add remarks..." onchange="updateItemRemark('${itemId}', this.value)">
          </div>
          <div class="form-group">
            <label>Upload Live Photos</label>
            <input type="file" accept="image/*" multiple onchange="handleImageUpload('${itemId}', this)">
            <div class="image-preview-container" id="preview_${itemId}"></div>
          </div>
        </div>
      `;
      itemsContainer.appendChild(card);
    });

    // Update Status and recalculate compliance score
    function updateItemStatus(itemId, selectElem) {
      const status = selectElem.value;
      itemDataStore[itemId].status = status;
      selectElem.className = `status-select ${status === 'VERIFIED' ? 'VERIFIED' : 'NOT_COMPLIANT'}`;
      calculateScore();
    }

    function updateItemRemark(itemId, value) {
      itemDataStore[itemId].remark = value;
    }

    // Calculate score percentage
    function calculateScore() {
      const items = Object.values(itemDataStore);
      const verifiedCount = items.filter(i => i.status === "VERIFIED").length;
      const score = Math.round((verifiedCount / items.length) * 100);
      const scoreDisplay = document.getElementById("scoreDisplay");
      scoreDisplay.innerText = `${score}%`;
      
      if (score >= 80) scoreDisplay.style.color = "#10B981"; // Green
      else if (score >= 50) scoreDisplay.style.color = "#F59E0B"; // Orange
      else scoreDisplay.style.color = "#EF4444"; // Red
    }

    // Convert uploaded photos to Base64 data URLs
    function handleImageUpload(itemId, input) {
      const files = Array.from(input.files);
      const previewContainer = document.getElementById(`preview_${itemId}`);
      previewContainer.innerHTML = "";
      itemDataStore[itemId].livePhotos = [];

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function (e) {
          const base64Img = e.target.result;
          itemDataStore[itemId].livePhotos.push(base64Img);

          const img = document.createElement("img");
          img.src = base64Img;
          previewContainer.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    }

    // Handle Form Submission to Power Automate HTTP Endpoint
    document.getElementById("auditForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const submitBtn = document.getElementById("submitBtn");
      const statusMessage = document.getElementById("statusMessage");

      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting Audit Report...";
      statusMessage.className = "";
      statusMessage.style.display = "none";

      const itemsArray = Object.values(itemDataStore);
      const verifiedCount = itemsArray.filter(i => i.status === "VERIFIED").length;
      const complianceScore = Math.round((verifiedCount / itemsArray.length) * 100);

      const payload = {
        facility: document.getElementById("facility").value,
        reviewNo: document.getElementById("reviewNo").value,
        date: document.getElementById("date").value,
        zone: document.getElementById("zone").value,
        incharge: document.getElementById("incharge").value,
        complianceScore: complianceScore,
        items: itemsArray
      };

      try {
        const response = await fetch(FLOW_HTTP_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (response.ok || response.status === 202) {
          statusMessage.className = "success";
          statusMessage.innerText = "✓ Audit report submitted successfully! Email report has been routed.";
        } else {
          throw new Error(`Server returned status: ${response.status}`);
        }
      } catch (err) {
        statusMessage.className = "error";
        statusMessage.innerText = `✕ Submission failed: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit 5S Audit Report";
      }
    });
  </script>
</body>
</html>
