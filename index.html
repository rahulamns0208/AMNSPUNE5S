<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AM/NS INDIA Pune - Area Incharge 5S Checklist</title>
  <style>
    :root {
      --primary-red: #E31837;
      --primary-red-hover: #C1121F;
      --dark-bg: #0F172A;
      --card-bg: rgba(255, 255, 255, 0.96);
      --slate-50: #F8FAFC;
      --slate-100: #F1F5F9;
      --slate-200: #E2E8F0;
      --slate-600: #475569;
      --slate-800: #1E293B;
      --success-green: #10B981;
      --warning-amber: #F59E0B;
      --radius-lg: 16px;
      --radius-md: 10px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      color: var(--slate-800);
      min-height: 100vh;
      padding: clamp(10px, 3vw, 30px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .main-wrapper {
      width: 100%;
      max-width: 1300px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: fadeIn 0.4s ease-out;
    }

    .app-header {
      background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
      padding: clamp(16px, 4vw, 28px);
      color: #FFFFFF;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 4px solid var(--primary-red);
    }

    .header-brand h1 {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #FFFFFF, #CBD5E1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-brand p { color: #94A3B8; font-size: clamp(12px, 2vw, 14px); margin-top: 4px; }

    .logo-badge {
      background: rgba(227, 24, 55, 0.15);
      border: 1px solid var(--primary-red);
      padding: 8px 16px;
      border-radius: 30px;
      text-align: right;
    }

    .logo-badge .company { font-weight: 900; font-size: 20px; color: var(--primary-red); line-height: 1; }
    .logo-badge .sub { font-size: 10px; color: #FFF; letter-spacing: 2px; text-transform: uppercase; }

    .audit-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      padding: clamp(16px, 3vw, 24px);
      background: var(--slate-50);
      border-bottom: 1px solid var(--slate-200);
    }

    .input-field { display: flex; flex-direction: column; gap: 6px; }
    .input-field label { font-size: 11px; font-weight: 700; color: var(--slate-600); text-transform: uppercase; letter-spacing: 0.5px; }
    .input-field input, .input-field select {
      padding: 12px 14px;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      font-size: 14px;
      background: #FFFFFF;
      color: var(--slate-800);
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .input-field input:focus, .input-field select:focus {
      outline: none;
      border-color: var(--primary-red);
      box-shadow: 0 0 0 3px rgba(227, 24, 55, 0.15);
    }

    .score-summary-bar {
      padding: 16px clamp(16px, 3vw, 24px);
      background: #FFFFFF;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--slate-200);
    }

    .score-info { display: flex; align-items: center; gap: 12px; }
    .score-info-title { font-size: 15px; font-weight: 700; color: var(--slate-800); }

    .meter-container {
      width: 200px;
      height: 10px;
      background: var(--slate-100);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--slate-200);
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: var(--primary-red);
      transition: width 0.4s ease, background-color 0.4s ease;
    }

    .score-pill {
      font-size: 20px;
      font-weight: 900;
      color: #FFFFFF;
      background: var(--primary-red);
      padding: 6px 18px;
      border-radius: 30px;
      box-shadow: var(--shadow-sm);
      transition: background-color 0.3s ease;
    }

    .audit-body { padding: clamp(16px, 3vw, 24px); }

    .category-section {
      margin-bottom: 28px;
      background: #FFFFFF;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .category-title {
      background: var(--slate-800);
      color: #FFFFFF;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .category-title::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--primary-red);
      border-radius: 50%;
    }

    .checklist-items { display: flex; flex-direction: column; }

    .item-card {
      display: grid;
      grid-template-columns: 40px 1.2fr 2fr 1.2fr 220px 130px;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--slate-100);
      transition: background-color 0.2s ease;
    }

    .item-card:last-child { border-bottom: none; }
    .item-card:hover { background: #FAF5F5; }

    .item-index {
      font-weight: 800;
      color: var(--primary-red);
      font-size: 13px;
      background: var(--slate-100);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-name { font-weight: 700; font-size: 14px; color: var(--slate-800); }
    .item-desc { font-size: 13px; color: var(--slate-600); line-height: 1.4; }

    .remark-field input {
      width: 100%;
      padding: 8px 10px;
      font-size: 12px;
      border: 1px solid var(--slate-200);
      border-radius: 6px;
      background: #FFFFFF;
      color: var(--slate-800);
    }

    /* Multi Image Upload Box */
    .photo-control-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .photo-control-box label {
      font-size: 10px;
      font-weight: 800;
      color: var(--slate-600);
      text-transform: uppercase;
    }

    .photo-input-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .photo-input-group input[type="file"] {
      font-size: 11px;
      width: 100%;
      color: var(--slate-600);
    }

    .btn-upload-img {
      background: var(--slate-800);
      color: #FFF;
      border: none;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease;
    }

    .btn-upload-img:hover {
      background: var(--primary-red);
    }

    .img-preview-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .img-preview-thumb {
      position: relative;
      width: 50px;
      height: 50px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--slate-200);
    }

    .img-preview-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-del-img {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(227, 24, 55, 0.9);
      color: white;
      border: none;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      font-size: 10px;
      line-height: 16px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-toggle {
      width: 100%;
      padding: 10px 12px;
      border-radius: 30px;
      border: 2px solid var(--slate-200);
      background: #FFFFFF;
      color: var(--slate-600);
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }

    .btn-toggle.active {
      background: var(--success-green);
      border-color: var(--success-green);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
    }

    .dock-footer {
      padding: 20px clamp(16px, 3vw, 24px);
      background: var(--slate-50);
      border-top: 1px solid var(--slate-200);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .status-text { font-size: 13px; font-weight: 600; color: var(--slate-600); }

    .btn-submit {
      background: linear-gradient(135deg, var(--primary-red) 0%, var(--primary-red-hover) 100%);
      color: #FFFFFF;
      border: none;
      padding: 14px 36px;
      font-size: 15px;
      font-weight: 800;
      border-radius: var(--radius-md);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(227, 24, 55, 0.35);
      transition: all 0.2s ease;
      width: 100%;
      max-width: 280px;
    }

    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(227, 24, 55, 0.45); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 960px) {
      .item-card { grid-template-columns: 36px 1fr; gap: 10px; padding: 16px; }
      .item-desc, .remark-field, .photo-control-box, .btn-toggle { grid-column: 1 / -1; }
    }

    @media (max-width: 600px) {
      .dock-footer { flex-direction: column; text-align: center; }
      .btn-submit { max-width: 100%; }
      .meter-container { width: 100%; }
      .score-summary-bar { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

<div class="main-wrapper">
  <header class="app-header">
    <div class="header-brand">
      <h1>AM/NS INDIA — Pune Facility</h1>
      <p>Area / Department Incharge 5S Review & Compliance Checklist</p>
    </div>
    <div class="logo-badge">
      <div class="company">AM/NS</div>
      <div class="sub">INDIA</div>
    </div>
  </header>

  <section class="audit-meta-grid">
    <div class="input-field">
      <label for="reviewNo">Review Cycle / No.</label>
      <input type="text" id="reviewNo" value="Review Cycle 1" placeholder="e.g. Review Cycle 1">
    </div>
    <div class="input-field">
      <label for="auditDate">Review Date</label>
      <input type="date" id="auditDate">
    </div>
    <div class="input-field">
      <label for="zone">Department / Zone Selection</label>
      <select id="zone" onchange="renderChecklist()">
        <optgroup label="Plant & Production Zones">
          <option value="CGL -1">CGL -1</option>
          <option value="CGL -2">CGL -2</option>
          <option value="CGL ELECTRICAL">CGL ELECTRICAL</option>
          <option value="CGL ME">CGL ME</option>
          <option value="CCL">CCL</option>
          <option value="CRM">CRM</option>
          <option value="ARP">ARP</option>
          <option value="PICKLING">PICKLING</option>
          <option value="CRM QUALITY">CRM QUALITY</option>
          <option value="CGL QUALITY">CGL QUALITY</option>
          <option value="CCL QUALITY">CCL QUALITY</option>
          <option value="LOGISTICS">LOGISTICS</option>
          <option value="UTILITY">UTILITY</option>
          <option value="CIVIL">CIVIL</option>
        </optgroup>
        <optgroup label="Office & Administrative Zones">
          <option value="MAIN OFFICE">MAIN OFFICE</option>
          <option value="HR DEPARTMENT">HR DEPARTMENT</option>
          <option value="FINANCE DEPARTMENT">FINANCE DEPARTMENT</option>
          <option value="PROJECTS OFFICE">PROJECTS OFFICE</option>
        </optgroup>
      </select>
    </div>
    <div class="input-field">
      <label for="incharge">REVIEWER Name</label>
      <input type="text" id="incharge" placeholder="Enter Reviewer Name">
    </div>
    <div class="input-field">
      <label for="sapId">Reviewer SAP ID</label>
      <input type="text" id="sapId" placeholder="e.g. 10023456" required>
    </div>
    <div class="input-field">
      <label for="reviewerEmail">Reviewer Email ID</label>
      <input type="email" id="reviewerEmail" placeholder="reviewer@amnsin.com" required>
    </div>
  </section>

  <section class="score-summary-bar">
    <div class="score-info">
      <span class="score-info-title">5S Compliance Verification Score</span>
      <div class="meter-container">
        <div class="meter-fill" id="meterFill"></div>
      </div>
    </div>
    <div class="score-pill" id="scoreDisplay">0%</div>
  </section>

  <main class="audit-body" id="checklistContainer"></main>

  <footer class="dock-footer">
    <div class="status-text" id="statusMessage">● Ready for Verification</div>
    <button class="btn-submit" onclick="submitAssessment()">Submit Review</button>
  </footer>
</div>

<script>
  document.getElementById('auditDate').valueAsDate = new Date();

  // Updated Web App Exec URL from Google Apps Script
  const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw0yxU0shL4VWcRMfr-cziM4w0LrVe9zvXxbkcDI4gUYSizLjiolSoY039YRK-6sNX-Fw/exec';

  // Store uploaded image Data URLs per checkpoint ID
  const itemImagesStore = {};

  const checklistData = {
    plant: {
      s1: [
        { id: "1s_1", name: "Unused Material & Scrap", desc: "Verify no scrap, broken pallets, or defective coils accumulate in active plant zones." },
        { id: "1s_2", name: "Red Tag Holding Area", desc: "Ensure non-moving machinery spare parts or tagged items are properly logged in the Red Tag Zone." },
        { id: "1s_3", name: "Material & Raw Coil Sorting", desc: "Verify active production coils and consumables are separated from non-active stock." },
        { id: "1s_4", name: "Clear Gangways & Exits", desc: "Ensure no temporary maintenance tools or scrap block crane routes or emergency exits." },
        { id: "1s_5", name: "Weekly 1S Training (Mandatory)", desc: "Verify weekly 1S training/toolbox talk on sorting and red-tagging was conducted for plant staff." }
      ],
      s2: [
        { id: "2s_1", name: "Name Plates & Equipment Tags", desc: "Check that all machinery, valves, panels, and chemical/oil drums have legible identification tags." },
        { id: "2s_2", name: "Shadow Boards & Tool Racks", desc: "Ensure maintenance and operational tools are stored on designated shadow boards when not in use." },
        { id: "2s_3", name: "Floor Demarcation Lines", desc: "Verify yellow/red boundary lines for coil storage, crane drop zones, and walkways are intact." },
        { id: "2s_4", name: "Min/Max Storage Visual Controls", desc: "Check min/max visual stock indicators and pressure/temperature range markings." },
        { id: "2s_5", name: "Weekly 2S Training (Mandatory)", desc: "Verify weekly 2S training was conducted on visual controls, tagging, and tool organization." }
      ],
      s3: [
        { id: "3s_1", name: "Routine Floor & Area Sweeping", desc: "Confirm regular shift sweeping, trash disposal, and general cleanliness of plant floor." },
        { id: "3s_2", name: "Oil Leakage & Spill Control", desc: "Inspect hydraulic rooms and oil cellars for leakage; ensure immediate cleanup and drip tray placement." },
        { id: "3s_3", name: "Equipment & Desk Cleanliness", desc: "Verify operator desks, pulpit glass, and control panels are clean of industrial dust and grease." },
        { id: "3s_4", name: "Cleanliness as Inspection", desc: "Verify operators check for loose bolts, cracks, or wear while performing cleaning routines." },
        { id: "3s_5", name: "Weekly 3S Training (Mandatory)", desc: "Verify weekly 3S training was conducted on cleaning standards, spill control, and equipment care." }
      ]
    },
    office: {
      s1: [
        { id: "1s_1", name: "Paper & File Archiving", desc: "Verify redundant documents, outdated printouts, and scrap paper are shredded/binned." },
        { id: "1s_2", name: "Unused Hardware & E-Waste", desc: "Ensure broken monitors, cables, and old IT assets are red-tagged and sent to store." },
        { id: "1s_3", name: "Desk Surface Sorting", desc: "Ensure only active work files and current work items are present on office desks." },
        { id: "1s_4", name: "Clear Passageways & Doors", desc: "Verify office walkways, fire extinguishers, and electrical control DBs are completely unobstructed." },
        { id: "1s_5", name: "Weekly 1S Training (Mandatory)", desc: "Verify weekly 1S office training was conducted on digital/physical sorting and decluttering." }
      ],
      s2: [
        { id: "2s_1", name: "File Cabinet & Tray Labeling", desc: "Check that all physical file binders, drawers, and document trays have clear name tags." },
        { id: "2s_2", name: "Stationery Shadow/Storage Trays", desc: "Verify stationery items (pens, staplers, stamps) have designated storage spots." },
        { id: "2s_3", name: "Cable Management & Wiring", desc: "Ensure computer power cables, LAN cables, and extension cords are tied and route-managed." },
        { id: "2s_4", name: "Digital File Organization", desc: "Verify shared drive folders follow standardized naming conventions and file structures." },
        { id: "2s_5", name: "Weekly 2S Training (Mandatory)", desc: "Verify weekly 2S training conducted on document indexing and visual office standards." }
      ],
      s3: [
        { id: "3s_1", name: "Daily Office Housekeeping", desc: "Verify desk dusting, floor mopping, and waste bin emptying are executed daily." },
        { id: "3s_2", name: "IT Equipment Cleanliness", desc: "Ensure computer screens, keyboards, printers, and copiers are clean and dust-free." },
        { id: "3s_3", name: "Pantry & Common Area Hygiene", desc: "Check pantry, coffee machine area, and conference rooms for neatness and clean surfaces." },
        { id: "3s_4", name: "Clean Desk Policy Compliance", desc: "Ensure desks are left completely clean and clear of sensitive documents at shift end." },
        { id: "3s_5", name: "Weekly 3S Training (Mandatory)", desc: "Verify weekly 3S training conducted on maintaining office hygiene and sanitization." }
      ]
    }
  };

  function isOfficeZone(zoneValue) {
    return ["MAIN OFFICE", "HR DEPARTMENT", "FINANCE DEPARTMENT", "PROJECTS OFFICE"].includes(zoneValue);
  }

  function renderChecklist() {
    const selectedZone = document.getElementById('zone').value;
    const type = isOfficeZone(selectedZone) ? 'office' : 'plant';
    const data = checklistData[type];
    const container = document.getElementById('checklistContainer');

    let html = '';
    const categories = [
      { title: "1S — SORT (SEIRI) — Area Verification", items: data.s1 },
      { title: "2S — SET IN ORDER (SEITON) — Area Verification", items: data.s2 },
      { title: "3S — SHINE (SEISO) — Area Verification", items: data.s3 }
    ];

    let overallIndex = 1;
    categories.forEach(cat => {
      html += `<div class="category-section"><div class="category-title">${cat.title}</div><div class="checklist-items">`;
      cat.items.forEach(item => {
        itemImagesStore[item.id] = itemImagesStore[item.id] || [];
        html += `
          <div class="item-card" data-id="${item.id}">
            <div class="item-index">${overallIndex++}</div>
            <div class="item-name">${item.name}</div>
            <div class="item-desc">${item.desc}</div>
            <div class="remark-field"><input type="text" class="item-remark" placeholder="Remark (Optional)"></div>
            <div class="photo-control-box">
              <label>Attach Photos</label>
              <div class="photo-input-group">
                <input type="file" id="file_${item.id}" accept="image/*" capture="environment">
                <button type="button" class="btn-upload-img" onclick="uploadImageForItem('${item.id}')">Upload</button>
              </div>
              <div class="img-preview-container" id="preview_${item.id}"></div>
            </div>
            <button class="btn-toggle" onclick="toggleStatus(this)">NOT COMPLIANT</button>
          </div>
        `;
      });
      html += `</div></div>`;
    });

    container.innerHTML = html;
    updateScoreMeter();
  }

  async function uploadImageForItem(itemId) {
    const fileInput = document.getElementById(`file_${itemId}`);
    if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
      alert("Please select an image file first.");
      return;
    }

    const file = fileInput.files[0];
    try {
      const base64 = await processAndResizeImage(file);
      if (base64) {
        if (!itemImagesStore[itemId]) {
          itemImagesStore[itemId] = [];
        }
        itemImagesStore[itemId].push(base64);
        renderImagePreviews(itemId);
        fileInput.value = ""; // Clear file input after successful add
      }
    } catch (err) {
      console.error("Image processing error:", err);
      alert("Unable to process selected image.");
    }
  }

  function deleteImageForItem(itemId, index) {
    if (itemImagesStore[itemId]) {
      itemImagesStore[itemId].splice(index, 1);
      renderImagePreviews(itemId);
    }
  }

  function renderImagePreviews(itemId) {
    const container = document.getElementById(`preview_${itemId}`);
    if (!container) return;
    const images = itemImagesStore[itemId] || [];
    let html = '';

    images.forEach((b64, idx) => {
      html += `
        <div class="img-preview-thumb">
          <img src="${b64}" alt="Thumb">
          <button type="button" class="btn-del-img" onclick="deleteImageForItem('${itemId}', ${idx})" title="Delete Image">✕</button>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  function toggleStatus(btn) {
    btn.classList.toggle('active');
    btn.innerText = btn.classList.contains('active') ? '✓ VERIFIED' : 'NOT COMPLIANT';
    updateScoreMeter();
  }

  function updateScoreMeter() {
    const buttons = document.querySelectorAll('.btn-toggle');
    if (buttons.length === 0) return { score: 0 };

    let activeCount = 0;
    buttons.forEach(b => { if (b.classList.contains('active')) activeCount++; });

    const score = Math.round((activeCount / buttons.length) * 100);
    const scorePill = document.getElementById('scoreDisplay');
    const meterFill = document.getElementById('meterFill');

    scorePill.innerText = score + '%';
    meterFill.style.width = score + '%';

    const color = score >= 80 ? '#10B981' : score >= 50 ? '#F59E0B' : '#E31837';
    scorePill.style.background = color;
    meterFill.style.background = color;

    return { activeCount, total: buttons.length, score };
  }

  function processAndResizeImage(file) {
    return new Promise((resolve, reject) => {
      if (!file) return resolve(null);
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("File reading failed"));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error("Image loading failed"));
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 600;

          if (width > height && width > maxDim) {
            height *= maxDim / width;
            width = maxDim;
          } else if (height > maxDim) {
            width *= maxDim / height;
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.5));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function submitAssessment() {
    const statusMsg = document.getElementById('statusMessage');

    const sapId = document.getElementById('sapId').value.trim();
    const reviewerEmail = document.getElementById('reviewerEmail').value.trim();

    if (!sapId || !reviewerEmail) {
      alert("Please enter both Reviewer SAP ID and Reviewer Email ID before submitting.");
      return;
    }

    const rows = document.querySelectorAll('.item-card');
    const scoreData = updateScoreMeter();

    statusMsg.innerHTML = '<span style="color:#F59E0B;">⏳ Processing images & submitting to Google Sheet...</span>';

    const reviewNo = document.getElementById('reviewNo').value;
    const auditDate = document.getElementById('auditDate').value;
    const zone = document.getElementById('zone').value;
    const incharge = document.getElementById('incharge').value || 'N/A';

    let tableRowsHtml = '';
    let itemIdx = 1;

    for (let row of rows) {
      const itemId = row.getAttribute('data-id');
      const name = row.querySelector('.item-name').innerText;
      const isDone = row.querySelector('.btn-toggle').classList.contains('active');
      const remarkVal = row.querySelector('.item-remark').value || 'N/A';
      const uploadedList = itemImagesStore[itemId] || [];

      let imagesHtml = '';
      uploadedList.forEach(base64 => {
        imagesHtml += `<img src="${base64}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 4px; margin-right: 4px; margin-bottom: 4px; border: 1px solid #ccc;"/>`;
      });

      const statusBadge = isDone 
        ? '<span style="color: #10B981; font-weight: bold;">✓ VERIFIED</span>' 
        : '<span style="color: #E31837; font-weight: bold;">NOT COMPLIANT</span>';

      tableRowsHtml += `
        <tr>
          <td style="padding: 8px; border: 1px solid #CBD5E1; text-align: center;">${itemIdx++}</td>
          <td style="padding: 8px; border: 1px solid #CBD5E1;">${name}</td>
          <td style="padding: 8px; border: 1px solid #CBD5E1;">${statusBadge}</td>
          <td style="padding: 8px; border: 1px solid #CBD5E1;">${remarkVal}</td>
          <td style="padding: 8px; border: 1px solid #CBD5E1;">${imagesHtml || 'No Image Attached'}</td>
        </tr>
      `;
    }

    const fullHtmlReport = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;margin:20px;color:#1E293B;}.header{background:#0F172A;color:white;padding:15px;border-bottom:4px solid #E31837;}.meta{margin:15px 0;font-size:13px;width:100%;border-collapse:collapse;}.meta td{padding:6px;border:1px solid #E2E8F0;background:#F8FAFC;}table.report-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:10px;}table.report-table th{background:#1E293B;color:white;padding:8px;border:1px solid #CBD5E1;}</style></head><body><div class="header"><h2 style="margin:0;">AM/NS INDIA Pune Facility</h2><p style="margin:4px 0 0 0;font-size:12px;color:#94A3B8;">5S Compliance Review Audit Report</p></div><table class="meta"><tr><td><strong>Review Cycle:</strong> ${reviewNo}</td><td><strong>Date:</strong> ${auditDate}</td></tr><tr><td><strong>Zone / Dept:</strong> ${zone}</td><td><strong>Area Incharge:</strong> ${incharge}</td></tr><tr><td><strong>Reviewer SAP ID:</strong> ${sapId}</td><td><strong>Reviewer Email:</strong> ${reviewerEmail}</td></tr><tr><td colspan="2"><strong>Compliance Score:</strong> <span style="font-size:16px;font-weight:bold;color:#E31837;">${scoreData.score}%</span></td></tr></table><table class="report-table"><thead><tr><th style="width:5%;">#</th><th style="width:25%;">Compliance Point</th><th style="width:12%;">Status</th><th style="width:23%;">Remark</th><th style="width:35%;">Captured Photos</th></tr></thead><tbody>${tableRowsHtml}</tbody></table></body></html>`;

    const payload = {
      facility: 'AM/NS INDIA Pune Facility',
      reviewNo: reviewNo,
      date: auditDate,
      zone: zone,
      incharge: incharge,
      reviewerSapId: sapId,
      reviewerEmail: reviewerEmail,
      complianceScore: scoreData.score,
      htmlReport: fullHtmlReport
    };

    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      statusMsg.innerHTML = '<span style="color:#10B981;">✓ Review submitted successfully! Refreshing page...</span>';
      setTimeout(() => {
        location.reload();
      }, 2000);

    } catch (err) {
      console.error(err);
      statusMsg.innerHTML = '<span style="color:#E31837;">✕ Submission failed. Please check network connection.</span>';
    }
  }

  window.onload = renderChecklist;
</script>
